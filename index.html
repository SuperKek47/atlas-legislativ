<div id="splash" aria-hidden="true"><div class="sp-in"><b>STRATIEV</b><span>Games</span></div></div>
<div id="fader" aria-hidden="true"></div>
<script>/* fără mărirea paginii cu două degete (iPhone ignoră user-scalable) */ ["gesturestart","gesturechange"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });</script>
<script>
/* ecranul STRATIEV Games: la prima deschidere sau după o pauză lungă (30 de minute) */
(function () { var k = 'atlas-last', now = Date.now(), last = 0; try { last = +localStorage.getItem(k) || 0; } catch (e) { }
  if (last && now - last < 30 * 60e3) document.getElementById('splash').remove(); else document.documentElement.classList.add('splashing');
  var mark = function () { try { localStorage.setItem(k, Date.now()); } catch (e) { } }; mark(); setInterval(mark, 60e3);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') return mark();
    var l = 0; try { l = +localStorage.getItem(k) || 0; } catch (e) { }
    if (Date.now() - l > 30 * 60e3 && !document.getElementById('splash')) {
      var d = document.createElement('div'); d.id = 'splash'; d.innerHTML = '<div class="sp-in"><b>STRATIEV</b><span>Games</span></div>'; document.body.prepend(d);
      setTimeout(function () { d.classList.add('out'); setTimeout(function () { d.remove(); }, 600); }, 1700);
    }
    mark(); }); })();
</script>
